[package]
name = "lorasmith"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
description = "Fine-tune an open LLM on your own data with one command, on any GPU or none."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/RegaLabs/lorasmith"
keywords = ["lora", "llm", "fine-tuning", "burn", "gpu"]
categories = ["science", "command-line-utilities"]

[features]
default = []
cuda = ["burn/cuda"]
rocm = ["burn/rocm"]
# Benchmarks GPU kernels on first use. About 20% faster training, but the benchmarks need
# enough extra memory that a 0.5B model no longer fits a 4 GB GPU.
autotune = ["burn/autotune"]

[dependencies]
anyhow = "1"
# Burn 0.23 isn't released, and two changes QLoRA needs aren't merged into it yet: the
# factored LoRA forward (tracel-ai/burn#6465) and a quantized matmul that autodiff keeps
# packed (tracel-ai/burn#6503). A build from this repository takes the commit below, which
# is Burn's main with both. crates.io can't depend on a git commit, so the published crate
# takes the pre-release named by `version` and trains without those two changes. Goes back
# to a plain version once 0.23 has them.
burn = { version = "=0.23.0-pre.2", git = "https://github.com/shahrryyar/burn.git", rev = "5a4134ad10049543cc79892ba73057bfd8b10725", default-features = false, features = [
    "std",
    "autodiff",
    "optim",
    "fusion",
    "wgpu",
    "flex",
    "safetensors",
] }
clap = { version = "4", features = ["derive"] }
hf-hub = { version = "0.4.3", default-features = false, features = ["ureq"] }
minijinja = { version = "3.1", features = ["json", "loop_controls", "serde"] }
minijinja-contrib = { version = "3.1", features = ["pycompat"] }
serde = { version = "1", features = ["derive"] }
safetensors = "0.8"
serde_json = "1"
sha2 = "0.10"
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }

[profile.release]
# Symbols are a quarter of the binary, and a release build has no debug info to go with them.
strip = true
